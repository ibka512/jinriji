name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium webkit
      - name: Browser acceptance
        env:
          JINRIJI_BASE_URL: http://127.0.0.1:4173
          JINRIJI_TEST_OUTPUT: test-results/screenshots-v1.0
        run: npm run test:browser:built
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            test-results/screenshots-v1.0
            test-results/screenshots-v1.0-webkit
          if-no-files-found: ignore
          retention-days: 7
